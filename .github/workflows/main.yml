name: Build Meowth Bridge arm64

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build meouth-bridge for arm64
        run: |
          # Replace 'meouth-bridge-dir' with the actual relative path to the bridge subfolder if necessary
          cd src/meouth-bridge || cd meouth-bridge || true 
          
          docker buildx build \
            --platform linux/arm64 \
            --output type=local,dest=./build-out \
            --file Dockerfile .

      - name: Upload arm64 Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meouth-bridge-arm64
          path: ./build-out/
